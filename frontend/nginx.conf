server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Detect bots
    set $is_bot 0;
    if ($http_user_agent ~* "(bot|crawler|spider|crawling|facebookexternalhit|whatsapp|twitter|telegram|linkedin|discord|slack|slackbot|twitterbot|linkedinbot|telegrambot|discordbot)") {
        set $is_bot 1;
    }

    # Property pages - SEO handling
    location ~ ^/properties/(?<prop_id>[a-zA-Z0-9_-]+)$ {
        # If bot, proxy to backend SEO endpoint
        if ($is_bot = 1) {
            proxy_pass http://real_estate_backend:3000/api/properties/seo-preview/$prop_id;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            break;
        }

        # Regular users get React app
        try_files $uri /index.html;
    }

    # Project pages - SEO handling
    location ~ ^/projects/(?<proj_id>[0-9]+)$ {
        # If bot, proxy to backend SEO endpoint
        if ($is_bot = 1) {
            proxy_pass http://real_estate_backend:3000/api/projects/seo-preview/$proj_id;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            break;
        }

        # Regular users get React app
        try_files $uri /index.html;
    }

    # All other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests
    location /api/ {
        proxy_pass http://real_estate_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}