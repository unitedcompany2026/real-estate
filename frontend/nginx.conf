server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Property pages - SEO handling
    location ~ ^/properties/(?<prop_id>[a-zA-Z0-9_-]+)$ {
        set $is_bot 0;
        if ($http_user_agent ~* "(bot|crawler|spider|crawling|facebookexternalhit|whatsapp|twitter|telegram|linkedin|discord|slack|slackbot|twitterbot|linkedinbot|telegrambot|discordbot)") {
            set $is_bot 1;
        }

        error_page 418 = @property_seo;
        if ($is_bot = 1) {
            return 418;
        }

        try_files $uri /index.html;
    }

    location @property_seo {
        # Extract language from Accept-Language header or use 'en' as default
        set $lang 'en';
        if ($http_accept_language ~* "^ka") {
            set $lang 'ka';
        }
        if ($http_accept_language ~* "^ru") {
            set $lang 'ru';
        }
        if ($http_accept_language ~* "^he") {
            set $lang 'he';
        }
        if ($http_accept_language ~* "^ar") {
            set $lang 'ar';
        }
        
        proxy_pass http://real_estate_backend:3000/api/properties/seo-preview/$prop_id?lang=$lang;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Language $http_accept_language;
    }

    # Project pages - SEO handling
    location ~ ^/projects/(?<proj_id>[0-9]+)$ {
        set $is_bot 0;
        if ($http_user_agent ~* "(bot|crawler|spider|crawling|facebookexternalhit|whatsapp|twitter|telegram|linkedin|discord|slack|slackbot|twitterbot|linkedinbot|telegrambot|discordbot)") {
            set $is_bot 1;
        }

        error_page 419 = @project_seo;
        if ($is_bot = 1) {
            return 419;
        }

        try_files $uri /index.html;
    }

    location @project_seo {
        # Extract language from Accept-Language header or use 'en' as default
        set $lang 'en';
        if ($http_accept_language ~* "^ka") {
            set $lang 'ka';
        }
        if ($http_accept_language ~* "^ru") {
            set $lang 'ru';
        }
        if ($http_accept_language ~* "^he") {
            set $lang 'he';
        }
        if ($http_accept_language ~* "^ar") {
            set $lang 'ar';
        }
        
        proxy_pass http://real_estate_backend:3000/api/projects/seo-preview/$proj_id?lang=$lang;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Language $http_accept_language;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://real_estate_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}